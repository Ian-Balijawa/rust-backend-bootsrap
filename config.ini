[database]
# Override with DATABASE_URL in deployment.
url = postgres://bootstrap:bootstrap@localhost:15432/axum_template

[redis]
# Override with REDIS_URL in deployment.
url = redis://localhost:16379/

[uploads]
# Use persistent storage shared by all API instances.
directory = uploads
max_bytes = 10485760

[log]
# Log level: error, warn, info, debug, trace
level = info

[mail]
# SMTP server configuration
smtp_server = smtp.example.com
smtp_port = 465
smtp_user = your_email@example.com
smtp_pass = your_password
